case_id = "mcp_multi_source_repo_evidence_cn"
suite_id = "challenge_mcp"
family = "challenge"
grader_id = "challenge"
enabled = true
required = true
description = "Use real GitHub MCP README plus commit or repository metadata evidence"
agent_id = "main"
profile_name = "openai_gpt_5_4"
tags = ["challenge", "mcp", "github", "hard"]

gate_components = ["task_success", "tool_path_quality"]

[[turns]]
role = "user"
content = "调用 GitHub MCP 读取 tiezhuli001/marten-runtime 的 README.md，再查询该仓库的提交或仓库元数据。请把 README 定位和提交/元数据证据合并成两点结论，每点标注证据来源。"

[setup]
session_history_fixture = "none"
memory_fixture = "none"
automation_fixture = "none"

[component_weights]
task_success = 35
reasoning_quality = 20
tool_path_quality = 25
state_continuity = 10
efficiency = 10

[grader_case.task_success]
contains_any = ["marten-runtime", "runtime", "README", "commit", "提交", "仓库"]
anchor_groups = [["README.md", "README"], ["提交", "commit", "metadata", "元数据"]]
forbid_all = ["工具执行失败", "请重试", "无法读取"]

[[grader_case.task_success.rubric_items]]
id = "readme_evidence"
points = 3
contains_any = ["README", "README.md"]

[[grader_case.task_success.rubric_items]]
id = "metadata_or_commit_evidence"
points = 4
contains_any = ["commit", "提交", "metadata", "元数据", "stars", "default_branch"]

[[grader_case.task_success.rubric_items]]
id = "two_point_synthesis"
points = 2
contains_any = ["1.", "2.", "两点", "第一", "第二"]

[[grader_case.task_success.rubric_items]]
id = "no_fabrication_or_failure"
points = 2
forbid_all = ["工具执行失败", "请重试", "无法读取"]

[grader_case.reasoning_quality]
contains_any = ["证据", "来源", "基于"]

[[grader_case.reasoning_quality.rubric_items]]
id = "source_attribution"
points = 4
contains_any = ["来源", "README.md", "commit", "提交"]

[[grader_case.reasoning_quality.rubric_items]]
id = "combines_sources"
points = 3
anchor_groups = [["README", "README.md"], ["commit", "提交", "metadata", "元数据"]]

[grader_case.tool_path_quality]
required_tools = ["mcp"]
min_tool_calls = 2
max_tool_calls = 8

[[grader_case.tool_path_quality.rubric_items]]
id = "called_mcp"
points = 3
required_tools = ["mcp"]
min_tool_calls = 1

[[grader_case.tool_path_quality.rubric_items]]
id = "multi_call_mcp"
points = 7
required_tools = ["mcp"]
min_tool_calls = 2

[[grader_case.tool_path_quality.rubric_items]]
id = "bounded_calls"
points = 2
max_tool_calls = 8

[grader_case.state_continuity]

[grader_case.efficiency]
max_llm_requests = 10
max_tool_calls = 8
max_repair_attempts = 2
