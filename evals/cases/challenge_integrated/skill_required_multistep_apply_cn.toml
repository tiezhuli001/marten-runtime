[[grader_case.tool_path_quality.rubric_items]]
id = "loads_skill"
points = 5
required_tools = ["skill"]
required_skill_ids = ["long-run-execution"]

[[grader_case.tool_path_quality.rubric_items]]
id = "bounded_skill_load"
points = 2
max_tool_calls = 3

[grader_case.state_continuity]
required_skill_ids = ["long-run-execution"]

[[grader_case.state_continuity.rubric_items]]
id = "skill_id_recorded"
