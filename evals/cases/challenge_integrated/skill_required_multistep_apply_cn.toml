case_id = "skill_required_multistep_apply_cn"
suite_id = "challenge_integrated"
family = "challenge"
grader_id = "challenge"
enabled = true
required = true
description = "Load requested long-run-execution skill and apply chunk verification discipline"
agent_id = "main"
profile_name = "openai_gpt_5_4"
channel_id = "eval"
tags = ["challenge", "integrated", "skill", "positive", "hard"]

gate_components = ["task_success", "tool_path_quality"]

[[turns]]
role = "user"
content = "使用 long-run-execution skill，说明 challenge eval 执行时每个 chunk 后要验证什么，并给出执行到完成的检查点。"

[setup]
session_history_fixture = "none"
memory_fixture = "none"
automation_fixture = "none"

[component_weights]
task_success = 35
reasoning_quality = 20
tool_path_quality = 20
state_continuity = 15
efficiency = 10

[grader_case.task_success]
contains_all = ["chunk", "验证"]
