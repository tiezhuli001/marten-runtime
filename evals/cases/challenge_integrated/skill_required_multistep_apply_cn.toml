[[grader_case.task_success.rubric_items]]
id = "chunk_verification"
points = 4
contains_all = ["chunk", "验证"]

[[grader_case.task_success.rubric_items]]
id = "test_doc_drift"
points = 4
contains_any = ["测试", "文档", "偏移", "drift"]

[[grader_case.task_success.rubric_items]]
id = "completion_checkpoint"
points = 3
contains_any = ["完成", "检查点", "最终"]

[grader_case.reasoning_quality]
contains_any = ["执行", "完成", "结果"]

[[grader_case.reasoning_quality.rubric_items]]
id = "uses_skill_process"
points = 4
contains_any = ["source of truth", "验证", "STATUS", "执行"]

[grader_case.tool_path_quality]
required_tools = ["skill"]
required_skill_ids = ["long-run-execution"]
